<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login | Deel Clone</title>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <div class="text-blue-600 text-3xl font-bold mb-8 text-center">MyOnBoard<span class="text-gray-800">.</span></div>
        <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">Inicia sesión en tu cuenta</h2>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Usuario o Nombre</label>
                <input type="text" id="user" class="w-full mt-1 p-3 border rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Ej: admin o Tu Nombre" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="pass" class="w-full mt-1 p-3 border rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Entrar</button>
        </form>
        <p id="error-msg" class="text-red-500 text-sm mt-4 hidden text-center"></p>
    </div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // CORRECCIÓN: Definimos 'usuario' para que coincida con el cuerpo del JSON
        const usuario = document.getElementById('user').value;
        const password = document.getElementById('pass').value;

        // Debug: Ahora sí las variables existen
        console.log("Intentando login con:", { usuario, password });

        try {
            const res = await fetch('http://127.0.0.1:8000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ 
                    usuario: usuario, // Enviamos la llave 'usuario' que espera Python
                    password: password 
                })
            });

            const data = await res.json();

            if (res.ok) {
                if (data.rol === "TRABAJADOR") {
                    localStorage.setItem('dni_empleado', data.dni);
                }
                window.location.href = data.redirect;
            } else {
                const errorMsg = document.getElementById('error-msg');
                // Si es un 422, mostramos el detalle técnico en consola para arreglarlo
                if (res.status === 422) {
                    console.error("Fallo de validación Pydantic:", data.detail);
                    errorMsg.innerText = "Error 422: El servidor no entiende el formato de los datos.";
                } else {
                    errorMsg.innerText = data.detail || "Error al iniciar sesión";
                }
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            console.error("Error de red:", err);
            alert("Servidor no disponible");
        }
    });
</script>
</body>
</html>
