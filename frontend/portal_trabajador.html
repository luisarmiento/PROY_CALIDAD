<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>Portal del Colaborador | MyOnBoard</title>
</head>
<body class="bg-gray-50 font-sans flex h-screen text-sm text-gray-900">
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 flex flex-col">
        <div class="p-6 text-2xl font-bold text-blue-600">MyOnBoard<span class="text-gray-800">.</span></div>
        <nav class="mt-6 flex-1">
            <a href="#" class="flex items-center px-6 py-3 bg-blue-50 text-blue-600 border-r-4 border-blue-600 font-medium">
                <i class="fas fa-home mr-3 w-5"></i> Inicio
            </a>
            <a href="#" class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition">
                <i class="fas fa-file-signature mr-3 w-5"></i> Mis Contratos
            </a>
            <a href="#" class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 transition">
                <i class="fas fa-user-shield mr-3 w-5"></i> Cumplimiento
            </a>
        </nav>
        <div class="p-6 border-t border-gray-100">
            <button onclick="logout()" class="flex items-center text-gray-500 hover:text-red-600 transition">
                <i class="fas fa-sign-out-alt mr-3"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">¡Hola, <span id="nombre-empleado">...</span>!</h1>
                <p class="text-gray-500">Bienvenido a tu portal de colaborador.</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="font-bold text-gray-800" id="user-display">...</p>
                    <p class="text-xs text-gray-400">Colaborador</p>
                </div>
                <div class="h-10 w-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold">
                    D
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-yellow-50 text-yellow-600 rounded-lg"><i class="fas fa-clock"></i></div>
                    <div>
                        <p class="text-gray-500 text-xs font-bold uppercase">Pendientes</p>
                        <h3 class="text-xl font-bold text-gray-800" id="count-pendientes">0</h3>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-green-50 text-green-600 rounded-lg"><i class="fas fa-check-circle"></i></div>
                    <div>
                        <p class="text-gray-500 text-xs font-bold uppercase">Firmados</p>
                        <h3 class="text-xl font-bold text-gray-800" id="count-firmados">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-gray-800">Mis Contratos Recientes</h3>
            </div>
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-gray-400 text-xs uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-3">Documento</th>
                        <th class="px-6 py-3">Fecha Emisión</th>
                        <th class="px-6 py-3">Estado</th>
                        <th class="px-6 py-3 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-contratos-personal" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </main>

<script>
    const dni = localStorage.getItem('dni_empleado');
    if (!dni) window.location.href = 'login.html';

    async function cargarDatosPortal() {
        try {
            const res = await fetch(`http://127.0.0.1:8000/empleado/${dni}`);
            const emp = await res.json();

            // Llenar Header y Saludo
            document.getElementById('nombre-empleado').innerText = emp.nombre;
            document.getElementById('user-display').innerText = `${emp.nombre} ${emp.apellido}`;

            // Lógica de Widgets
            if(emp.status === 'ACTIVO') {
                document.getElementById('count-firmados').innerText = "1";
                document.getElementById('count-pendientes').innerText = "0";
            } else {
                document.getElementById('count-firmados').innerText = "0";
                document.getElementById('count-pendientes').innerText = "1";
            }

            // Llenar Tabla
            const tabla = document.getElementById('lista-contratos-personal');
            const colorClase = emp.status === 'ACTIVO' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
            
            tabla.innerHTML = `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-file-pdf text-red-500 text-lg"></i>
                            <div>
                                <p class="font-bold text-gray-800">Contrato Laboral - ${emp.puesto}</p>
                                <p class="text-xs text-gray-400">PDF Documento Legal</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-500">12 Abr 2026</td>
                    <td class="px-6 py-4">
                        <span class="${colorClase} px-2 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                            ${emp.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        ${emp.status !== 'ACTIVO' 
                            ? `<button onclick="confirmarFirma()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-700 transition">Firmar Ahora</button>`
                            : `<a href="http://127.0.0.1:8000/${emp.contrato_pdf}" target="_blank" class="text-blue-600 font-bold text-xs hover:underline">Descargar</a>`
                        }
                    </td>
                </tr>
            `;
        } catch (error) {
            console.error("Error cargando portal:", error);
        }
    }

    async function confirmarFirma() {
        if(!confirm("Al firmar, aceptas los términos legales de MyOnBoard. ¿Proceder?")) return;
        const res = await fetch(`http://127.0.0.1:8000/firmar/${dni}`);
        if(res.ok) {
            alert("✅ Contrato firmado exitosamente.");
            cargarDatosPortal(); // Recarga la tabla y widgets
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    window.onload = cargarDatosPortal;
</script>   

</body>
</html>
